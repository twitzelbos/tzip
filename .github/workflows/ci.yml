name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same PR when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Override `.cargo/config.toml`'s `target-cpu=native -C target-feature=+aes,+sha`
      # on Linux runners. GitHub's ubuntu-latest hardware rotates across CPUs;
      # some lack SHA-NI, and compiling dependency build scripts (notably
      # `ring`) with `+sha` produces instructions that SIGILL on those
      # runners. `x86-64-v3` guarantees AVX2 (Haswell+, 2013) and leaves
      # AES-NI available via `cpufeatures` runtime dispatch — which is what
      # the tzip binary actually needs. macOS (aarch64) runners keep the
      # ARMv8 crypto path from config.toml unchanged; M-series silicon
      # always has the required extensions.
      - name: Set safe RUSTFLAGS (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        # `RUSTFLAGS` (not `CARGO_BUILD_RUSTFLAGS`) is required: cargo's
        # precedence is RUSTFLAGS > [target.<triple>.rustflags] >
        # [build.rustflags] > CARGO_BUILD_RUSTFLAGS, so CARGO_BUILD_RUSTFLAGS
        # alone is still overridden by our .cargo/config.toml's
        # `[target.'cfg(target_arch = "x86_64")'].rustflags`.
        run: echo "RUSTFLAGS=-C target-cpu=x86-64-v3" >> "$GITHUB_ENV"

      # The roundtrip tests shell out to `7z` to verify bzip2 / lzma / xz /
      # zstd / .7z extraction. They skip gracefully if it isn't installed,
      # but we want to actually exercise those paths in CI.
      - name: Install p7zip + FUSE3 (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y p7zip-full fuse3 libfuse3-dev

      - name: Install p7zip (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install p7zip

      - name: cargo check (default features)
        run: cargo check --verbose --all-targets

      - name: cargo check (raw-apfs)
        run: cargo check --verbose --features raw-apfs --all-targets

      - name: cargo check (raw-apfs + io-uring, Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo check --verbose --features raw-apfs,io-uring --all-targets

      - name: cargo test
        run: cargo test --verbose

      # Architectural lint: narrow interfaces + no module cycles +
      # bounded directory sizes. Keeps the structural gains from PR
      # #62 (the big deslop refactor) from drifting back as the
      # codebase grows. Pinned to a crates.io version so CI stays
      # deterministic; runs on both OSes because `--target` /
      # `#[cfg]`-gated modules differ between macOS and Linux and
      # the lint re-indexes per configuration.
      - name: Install deslop-please
        run: cargo install --locked deslop-please@0.1.4
      - name: Run deslop-please
        run: deslop-please
