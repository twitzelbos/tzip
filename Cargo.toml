[package]
name = "tzip"
version = "0.1.0"
edition = "2021"
authors = ["Thomas Witzel <thomas@q.bio>"]
description = "The best zip tool ever — parallel, hardware-AES-256, DEFLATE via libdeflater"
license = "BSD-3-Clause"

[[bin]]
name = "tzip"
path = "src/main.rs"

[features]
default = []
# Enable the raw-APFS-block reader (`--raw-block`, macOS-only source that
# reads files directly from `/dev/rdiskN` by parsing APFS on-disk format).
# Bypasses the VFS layer and any AV that hooks it. Adds the vendored
# `apfs` crate as a dependency (see vendor/dpp).
raw-apfs = ["dep:apfs"]

[dependencies]
# Vendored APFS parser (MIT, from Dil4rd/dpp).
apfs = { path = "vendor/dpp/apfs", optional = true }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
thiserror = "1"

# Walking & IO
jwalk = "0.8"
memmap2 = "0.9"
crossbeam-channel = "0.5"
rayon = "1.10"
num_cpus = "1.16"

# Compression
libdeflater = "1.19"
flate2 = { version = "1.0", default-features = false, features = ["zlib-ng"] }
bzip2 = "0.4"
xz2 = "0.1"
zstd = { version = "0.13", default-features = false }
sevenz-rust = { version = "0.6", features = ["aes256"] }

# Hashing / checksums
crc32fast = "1.4"

# WinZIP AES-256 (AE-2). The aes crate dispatches to ARMv8 crypto extensions
# on Apple Silicon and to AES-NI on x86_64 at runtime via `cpufeatures`.
# The sha1 crate does the same for ARMv8 SHA-1 (sha1c/sha1p/sha1m) and SHA-NI.
# Both accelerations kick in automatically when RUSTFLAGS or the release profile
# below sets `target-cpu=native`.
aes = "0.8"
ctr = "0.9"
cipher = "0.4"
hmac = "0.12"
sha1 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand = "0.8"

# Progress
indicatif = "0.17"
ratatui = "0.28"
crossterm = "0.28"

# Passwords
rpassword = "7"

# Misc
byteorder = "1.5"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
zip = "0.6"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "thin"
