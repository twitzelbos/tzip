[package]
name = "tzip"
version = "0.2.0"
edition = "2021"
authors = ["Thomas Witzel <thomas@q.bio>"]
description = "The best zip tool ever — parallel, hardware-AES-256, DEFLATE via libdeflater"
license = "BSD-3-Clause"

[lib]
name = "tzip"
path = "src/lib.rs"
# `cdylib` so `libtzip.dylib` ships with the macOS FSKit extension bundle
# (its Swift module links against the tzip_* ABI symbols at load time).
# `rlib` so the binary target can keep using it as a normal Rust library.
crate-type = ["rlib", "cdylib"]
# Doc tests are off: the crate has no real doctests, and several modules
# have `///` comments with ASCII diagrams / pseudo-code that cargo
# otherwise tries to compile as Rust (ZIP wire-format diagrams in
# zipwriter.rs, LZMA layout in decompress.rs, state transitions, ...).
doctest = false

[[bin]]
name = "tzip"
path = "src/main.rs"

[features]
default = []
# Enable the io_uring-backed file-body reader on Linux (`--io-uring`).
# Async submission-queue reads at high queue depth let a single reader
# thread saturate NVMe. Pairs with the FIEMAP extent-order reader
# (`--raw-block`): files are submitted in physical-disk order. Kernel ≥ 5.6.
io-uring = ["dep:io-uring"]
# Enable the raw-APFS-block reader (`--raw-block`, macOS-only source that
# reads files directly from `/dev/rdiskN` by parsing APFS on-disk format).
# Bypasses the VFS layer and any AV that hooks it. Adds the vendored
# `apfs` crate as a dependency (see vendor/dpp).
raw-apfs = ["dep:apfs"]
# Enable `tzip mount` on macOS 15+ via FSKit. Requires Xcode CLI tools
# (`swiftc`, `codesign`) at build time. Pulls in Keychain support via
# `security-framework` + runs cbindgen for the Rust↔Swift ABI header.
fskit = ["dep:security-framework", "dep:cbindgen"]

[dependencies]
# Vendored (patched) APFS parser (MIT, upstream Dil4rd/dpp).
# Local patch to extents.rs batches file reads to 4 MiB instead of 4 KiB,
# raising throughput 26× on USB drives. See docs/RAW_BLOCK.md.
apfs = { path = "vendor/apfs", optional = true }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
thiserror = "1"

# Walking & IO
jwalk = "0.8"
memmap2 = "0.9"
crossbeam-channel = "0.5"
rayon = "1.10"
num_cpus = "1.16"

# Compression
libdeflater = "1.19"
flate2 = { version = "1.0", default-features = false, features = ["zlib-ng"] }
bzip2 = "0.4"
xz2 = "0.1"
zstd = { version = "0.13", default-features = false }
sevenz-rust = { version = "0.6", features = ["aes256"] }

# Hashing / checksums
crc32fast = "1.4"

# WinZIP AES-256 (AE-2). The aes crate dispatches to ARMv8 crypto extensions
# on Apple Silicon and to AES-NI on x86_64 at runtime via `cpufeatures`.
# The sha1 crate does the same for ARMv8 SHA-1 (sha1c/sha1p/sha1m) and SHA-NI.
# Both accelerations kick in automatically when RUSTFLAGS or the release profile
# below sets `target-cpu=native`.
aes = "0.8"
ctr = "0.9"
cipher = "0.4"
hmac = "0.12"
sha1 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand = "0.8"

# Progress
indicatif = "0.17"
ratatui = "0.28"
crossterm = "0.28"

# Passwords
rpassword = "7"

# Misc
byteorder = "1.5"
libc = "0.2"
parking_lot = "0.12"

# Remote archive sources: HTTP(S) Range reader + S3 reader (SigV4-signed).
# ureq is synchronous (no tokio runtime), tiny dep tree, rustls by default —
# matches tzip's std-thread model. url is used by both sources for parsing.
# sha2 pairs with the existing sha1 for SigV4's HMAC chain.
ureq = { version = "2.10", default-features = false, features = ["tls", "gzip"] }
url = "2.5"
sha2 = "0.10"
md-5 = "0.10"

# Phase 1 of the Elastic feature-parity work: minimal-perfect-hash
# over CDR entry names so `tzip cat NAME` / `tzip x NAME` lookups are
# O(1) instead of O(N). Pure Rust, static-key-set only — which exactly
# matches tzip's write-once-and-append archive model.
boomphf = { version = "0.6", features = ["serde"] }
# bincode serialises the MPH table into the archive entry.
bincode = "1.3"

# `tzip grep` fan-out: regex is the exact engine ripgrep uses.
# serde/serde_json handle checkpoint JSONL + --json output with correct
# string escaping. quick-xml parses the S3 ListObjectsV2 XML responses
# used for bucket-globbing (`s3://bucket/prefix/*.zip`).
regex = "1.11"
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps `serde_json::Map` keys in source order on
# iteration, which Phase 5c columnar auto-infer needs: the derived
# schema column order mirrors how fields appeared in the first JSON
# sample, not HashMap-random.
serde_json = { version = "1", features = ["preserve_order"] }
quick-xml = "0.36"
tempfile = "3"

# `tzip mount` LRU cache + SIGINT-triggered clean unmount. Both tiny,
# no transitive dependency drag.
lru = "0.12"
signal-hook = "0.3"

# Optional: pulled in by the `fskit` feature on macOS 15+. `security-framework`
# is a thin Rust wrapper over macOS Security.framework — used here to stash
# AES mount passwords in the user Keychain under a per-mount UUID tag.
security-framework = { version = "2.11", optional = true }
compcol = { version = "0.8", default-features = false, features = ["zip_shrink", "zip_reduce", "zip_implode", "alloc", "deflate64", "ppmd"] }
ppmd-rust = "1.5"

# Phase 5 of the Elastic feature-parity work: Parquet columnar sidecar
# for deep aggregations via DuckDB. `tzip create --write-columnar
# schema.json` extracts declared fields into a Parquet file stored as
# `.tzip/columnar.v1.parquet`; `tzip query --sql "..."` shells out to
# the system `duckdb` CLI (not bundled) to run SQL against it.
# parquet's `arrow` feature re-uses the arrow-{array,schema,buffer}
# crates below. `snap` is Snappy, Parquet's default page codec.
parquet = { version = "60", default-features = false, features = ["arrow", "snap"] }
arrow-array = "60"
arrow-schema = "60"
# `bytes` is already in the tree transitively via parquet; naming it
# explicitly so columnar.rs can read sidecar metadata back out via
# `ArrowReaderMetadata::load(&Bytes, ...)`.
bytes = "1"

# `tzip jq` streamed-JSON filter. jaq is a pure-Rust jq clone that
# compiles filters once and runs them against arbitrary values —
# fits naturally with tzip's per-entry stream model. No tokio, no
# bundled C deps; faster than jq 1.6 on the kinds of ad-hoc queries
# tzip users run across archive shards.
jaq-core = "3"
jaq-std = "3"
jaq-json = "2"

# Linux io_uring reader (optional, behind the `io-uring` feature) +
# FUSE3 for `tzip mount`. `fuser` only compiles on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.6", optional = true }
fuser = "0.14"

[dev-dependencies]
tempfile = "3"
zip = "0.6"
# Local HTTP fixture for reader_http / reader_s3 integration tests.
tiny_http = "0.12"
# Hash-feature tests compute reference digests independently of the
# tzip library path, so they pull the same crates tzip uses at runtime.
sha2 = "0.10"
md-5 = "0.10"

[build-dependencies]
cc = "1"
# `fskit` feature builds a .fs extension bundle whose Swift side consumes
# this C header to call into the Rust ABI. cbindgen is optional and only
# pulled in by `--features fskit`.
cbindgen = { version = "0.27", optional = true }

[[example]]
name = "raw_apfs_probe"
required-features = ["raw-apfs"]

# ── Integration tests ────────────────────────────────────────────────────
# Grouped on disk under tests/index/, tests/zip/, tests/cmd/,
# tests/remote/ so `ls tests/` stays legible instead of being a wall
# of 20+ flat files (what deslop-please's `wide-directory` lint
# picks up). Each file is still its own integration-test crate;
# cargo just needs the explicit `path = ...` to find them.

[[test]]
name = "aggregate"
path = "tests/index/aggregate.rs"
[[test]]
name = "columnar"
path = "tests/index/columnar.rs"
[[test]]
name = "columnar_segments"
path = "tests/index/columnar_segments.rs"
[[test]]
name = "columnar_autoinfer"
path = "tests/index/columnar_autoinfer.rs"
[[test]]
name = "index_segments"
path = "tests/index/index_segments.rs"
[[test]]
name = "indexcache"
path = "tests/index/indexcache.rs"
[[test]]
name = "cdr_cache"
path = "tests/index/cdr_cache.rs"
[[test]]
name = "nameidx"
path = "tests/index/nameidx.rs"
[[test]]
name = "shards"
path = "tests/index/shards.rs"
[[test]]
name = "termidx"
path = "tests/index/termidx.rs"
[[test]]
name = "equivalence"
path = "tests/index/equivalence.rs"

[[test]]
name = "extract_parallel"
path = "tests/zip/extract_parallel.rs"
[[test]]
name = "hash"
path = "tests/zip/hash.rs"
[[test]]
name = "mount"
path = "tests/zip/mount.rs"
[[test]]
name = "multidisk"
path = "tests/zip/multidisk.rs"
[[test]]
name = "roundtrip"
path = "tests/zip/roundtrip.rs"
[[test]]
name = "update"
path = "tests/zip/update.rs"
[[test]]
name = "crash_matrix"
path = "tests/zip/crash_matrix.rs"
[[test]]
name = "zipcrypto"
path = "tests/zip/zipcrypto.rs"

[[test]]
name = "bench"
path = "tests/cmd/bench.rs"
[[test]]
name = "diff"
path = "tests/cmd/diff.rs"
[[test]]
name = "find"
path = "tests/cmd/find.rs"
[[test]]
name = "tail"
path = "tests/cmd/tail.rs"
[[test]]
name = "grep"
path = "tests/cmd/grep.rs"
[[test]]
name = "reader"
path = "tests/cmd/reader.rs"
[[test]]
name = "jq"
path = "tests/cmd/jq.rs"

[[test]]
name = "reader_http"
path = "tests/remote/reader_http.rs"
[[test]]
name = "reader_s3"
path = "tests/remote/reader_s3.rs"
[[test]]
name = "writer_s3"
path = "tests/remote/writer_s3.rs"

[[test]]
name = "linux_extent"
path = "tests/linux_extent.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "thin"

# Release-perf but with symbols kept so `sample` / Instruments produce
# readable stack traces. Build with:
#   cargo build --profile profiling --features raw-apfs
[profile.profiling]
inherits = "release"
strip = "none"
debug = "line-tables-only"
